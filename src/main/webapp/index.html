<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo Application</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #0f172a, #1e3a8a, #2563eb);
    }

    .container {
        width: 450px;
        padding: 50px 40px;
        text-align: center;
        background: #ffffff;
        border-radius: 24px;
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.25);
    }

    .icon {
        font-size: 64px;
        margin-bottom: 20px;
    }

    h1 {
        font-size: 38px;
        color: #0f172a;
        margin-bottom: 12px;
        font-weight: 700;
    }

    p {
        font-size: 17px;
        color: #64748b;
        margin-bottom: 35px;
        line-height: 1.6;
    }

    .btn {
        display: inline-block;
        padding: 14px 32px;
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        color: #ffffff;
        text-decoration: none;
        font-size: 18px;
        font-weight: 600;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(37, 99, 235, 0.35);
        transition: all 0.3s ease;
    }

    .btn:hover {
        background: linear-gradient(135deg, #1d4ed8, #1e40af);
        transform: translateY(-2px);
        box-shadow: 0 14px 30px rgba(37, 99, 235, 0.45);
    }

    footer {
        margin-top: 30px;
        font-size: 14px;
        color: #94a3b8;
    }
</style>
</head>
<body>

<div class="container">
    <div class="icon">📝</div>
    <h1>Todo Application</h1>
    <p>Manage your tasks efficiently and stay productive every day.</p>

    <a href="todos" class="btn">View All Todos</a>

    <footer>Simple • Clean • Professional</footer>
</div>

</body>
</html>
